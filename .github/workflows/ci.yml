name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # HUSKY=0 skips the `prepare` hook which tries to install local git hooks
      # that don't apply in CI.
      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund

      # Fail on a known high/critical advisory in anything that ships in the
      # image. Dev-only tooling is left to Dependabot's PRs.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # TypeScript references generated Prisma Client types — generate before typechecking.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Pin the "upgrade from an empty DB" path so a stranger's first
      # install can't fail on an untested migration. Also catches the
      # case where someone edits schema.prisma without running
      # `prisma migrate dev` to generate a matching migration.
      - name: Migration smoke test
        run: bash scripts/migration-smoke-test.sh

  e2e:
    name: End-to-end smoke (Playwright)
    runs-on: ubuntu-latest
    # Runs the production build against a seeded SQLite DB and a stub
    # TMDB/*arr server (e2e/stub-server.mjs) -- no external services.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    # deploy.ps1 builds this same Dockerfile on the server; catch a broken
    # Dockerfile or .dockerignore here instead of mid-deploy. Not pushed.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: lexarr:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must start, migrate an empty DB and answer /api/livez.
      - name: Start and probe
        run: |
          docker run -d --name lexarr-ci -p 5056:5056 \
            -e NEXTAUTH_SECRET=ci-only-secret -e AUTH_TRUST_HOST=true \
            -e ARR_HOST=http://127.0.0.1 -e RADARR_API_KEY=x -e SONARR_API_KEY=x \
            -e LIDARR_API_KEY=x -e TMDB_API_KEY=x lexarr:ci
          for i in $(seq 1 45); do
            if curl -fs http://localhost:5056/api/livez >/dev/null; then
              echo "livez up after ${i}s"; curl -s http://localhost:5056/api/version; exit 0
            fi
            sleep 1
          done
          docker logs lexarr-ci
          exit 1
