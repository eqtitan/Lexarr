name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # HUSKY=0 skips the `prepare` hook which tries to install local git hooks
      # that don't apply in CI.
      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund

      # TypeScript references generated Prisma Client types — generate before typechecking.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Pin the "upgrade from an empty DB" path so a stranger's first
      # install can't fail on an untested migration. Also catches the
      # case where someone edits schema.prisma without running
      # `prisma migrate dev` to generate a matching migration.
      - name: Migration smoke test
        run: bash scripts/migration-smoke-test.sh
