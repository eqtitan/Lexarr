name: Publish image

# Pushes ghcr.io/eqtitan/lexarr when a release tag (vX.Y.Z) is pushed. The
# workflow file must already be on master when the tag is created.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The tag, package.json and the image tag must agree, or /api/version
      # and `docker pull ...:X.Y.Z` would disagree about what is inside.
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z, X.Y and latest. Pre-release tags (v1.0.0-rc.1) get only their
      # own version tag, never latest.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eqtitan/lexarr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build once and prove the image starts before anything is pushed.
      - name: Build (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: lexarr:release-check
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start and probe
        run: |
          docker run -d --name lexarr-release -p 5056:5056 \
            -e NEXTAUTH_SECRET=ci-only-secret -e AUTH_TRUST_HOST=true \
            -e ARR_HOST=http://127.0.0.1 -e RADARR_API_KEY=x -e SONARR_API_KEY=x \
            -e LIDARR_API_KEY=x -e TMDB_API_KEY=x lexarr:release-check
          for i in $(seq 1 45); do
            if curl -fs http://localhost:5056/api/livez >/dev/null; then
              echo "livez up after ${i}s"
              curl -s http://localhost:5056/api/version
              exit 0
            fi
            sleep 1
          done
          docker logs lexarr-release
          exit 1

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha
