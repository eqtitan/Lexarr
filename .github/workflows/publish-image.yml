name: Publish image to ghcr.io

# Fires whenever a `v*` tag is pushed (i.e. after `npm run release`).
# Builds the Lexarr Docker image and publishes it to the GitHub Container
# Registry so anyone can `docker pull ghcr.io/eqtitan/lexarr:<version>`.
#
# While the repo is private, the image is also private — ghcr.io mirrors
# the repo's visibility. Once the repo flips public at 1.0.0, every
# already-pushed tag becomes pullable without a login.

on:
  push:
    tags:
      - "v*"

# GITHUB_TOKEN needs `packages: write` + `contents: read` to push to ghcr.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build + push ghcr.io/${{ github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase image name — ghcr.io rejects uppercase. Repo is
      # `eqtitan/Lexarr`; image path must be `eqtitan/lexarr`.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # `v0.10.0` tag → `0.10.0` image tag (strip the `v` prefix)
            type=semver,pattern={{version}}
            # `v0.10.0` → also `0.10` (minor channel) for convenience
            type=semver,pattern={{major}}.{{minor}}
            # Only the latest non-pre-release becomes `:latest`
            type=semver,pattern={{version}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-use the buildx layer cache between runs so minor bumps
          # skip node_modules install when package-lock hasn't changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
