<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gP3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="goldP3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="bgP3" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#1e1b3a"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="rowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bgP3)"/>
  <!-- Soft halo behind the highlighted row -->
  <ellipse cx="88" cy="136" rx="60" ry="22" fill="url(#rowGlow)"/>
  <!-- L from rows, emergence fade, with ONE gold row (the found entry) -->
  <g fill="url(#gP3)">
    <rect x="68" y="64"  width="40" height="16" rx="3" opacity="0.18"/>
    <rect x="68" y="88"  width="40" height="16" rx="3" opacity="0.32"/>
    <rect x="68" y="112" width="40" height="16" rx="3" opacity="0.52"/>
  </g>
  <!-- The gold row -->
  <rect x="68" y="136" width="40" height="16" rx="3" fill="url(#goldP3)"/>
  <g fill="url(#gP3)">
    <rect x="68" y="160" width="40" height="16" rx="3" opacity="0.9"/>
    <rect x="68" y="192" width="124" height="16" rx="3" opacity="1"/>
  </g>
</svg>
