# ============================================================
# Lexarr — docker-compose example
# ============================================================
# A complete, runnable setup. Copy `.env.example` → `.env`, fill in
# values, then:
#
#   docker compose up -d --build
#   docker compose logs -f lexarr     # watch for "Ready in ..."
#
# Open http://<your-host>:5056 — the first user to sign up becomes
# admin.
#
# This config assumes the Lexarr repo is cloned locally and built
# from source. To run the pre-built image instead, swap `build: .` for
# `image: ghcr.io/eqtitan/lexarr:<version>` (or `:latest`), then use
# `docker compose pull && docker compose up -d`.
# ============================================================

services:
  lexarr:
    build: .
    container_name: lexarr
    restart: unless-stopped
    ports:
      # Host:Container. Change the host side if 5056 is taken; the
      # container always listens on 5056 internally.
      - "5056:5056"
    env_file: .env
    # Hardening: Lexarr runs as an unprivileged user and needs no Linux
    # capabilities. Memory and process caps sit well above normal use
    # (~90 MiB, ~65 processes).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    # env_file above pulls every variable from .env. We still declare
    # a couple of Docker-specific overrides below because they use
    # container-local paths that don't make sense in .env.
    environment:
      # DB lives in the named volume below, not wherever .env points.
      - DATABASE_URL=file:/app/data/lexarr.db
      - AUTH_TRUST_HOST=true
    volumes:
      # SQLite DB + user uploads. Backed up via scripts/lexarr-db-backup.sh
      # on the Unraid host (if present).
      - lexarr-data:/app/data
      # (optional) Read-only mount of the host's stack-healthcheck
      # report directory. Without this mount, the "Stack Health" KPI
      # tile on the admin dashboard falls back to its healthy/unhealthy
      # service ratio — the deep-link modal shows "volume not mounted."
      # Comment out if you don't run the host-side stack-healthcheck cron.
      # - /mnt/user/data/stack-healthcheck:/stack-health:ro
    # Docker-native health check — probes /api/livez (app + DB only). It
    # does not check the *arr apps, so Lexarr stays green when they are down;
    # readiness (DB + at least one *arr) is /api/healthz. Unraid shows green / red based on this.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5056/api/livez"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  lexarr-data:
